name = "cre8-api"
main = "src/index.ts"
compatibility_date = "2026-01-15"

# The editor itself is a static Next.js build on Cloudflare Pages. This Worker
# is only the API and the published-site origin, so it stays small and its
# invocations stay cheap — everything a visitor loads is served from cache.

[[d1_databases]]
binding = "DB"
database_name = "cre8"
database_id = "0375dbbf-261d-40a6-9000-28e24a1d6d4e"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "cre8-assets"

[[r2_buckets]]
binding = "SITES"
bucket_name = "cre8-sites"

[vars]
# Comma-separated list of origins allowed to call the API. The editor's own
# origin MUST be in here or the browser blocks every request — add your Pages
# domain before pointing the editor at this Worker.
ALLOWED_ORIGINS = "http://localhost:3000"

# There is no authentication yet (see `ownerFrom` in src/index.ts). With this
# set to "true" every request is treated as the same owner, which is fine for a
# personal instance and a data leak on a shared one: any visitor would see and
# be able to delete every project. Leave it off until real auth is wired in,
# or accept that the API is single-user.
ALLOW_ANONYMOUS = "false"

# Published sites are served from a wildcard route so every project gets a
# subdomain without a per-project deploy.
# [[routes]]
# pattern = "*.cre8.site/*"
# zone_name = "cre8.site"
